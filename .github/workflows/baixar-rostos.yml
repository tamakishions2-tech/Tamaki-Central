# Baixa imagens listadas em tmp-rostos/urls.txt ("nome url" por linha) para tmp-rostos/.
# Usado pelo Claude para trazer resultados do OpenArt (o ambiente dele não acessa o CDN).
name: baixar-rostos
on:
  push:
    paths: ["tmp-rostos/urls.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar
        run: |
          while read -r nome url; do
            [ -z "$nome" ] && continue
            curl -fsSL -A "Mozilla/5.0" -o "tmp-rostos/$nome" "$url" && echo "ok $nome"
          done < tmp-rostos/urls.txt
      - name: Salvar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tmp-rostos
          git commit -m "Imagens baixadas para tmp-rostos" || exit 0
          git push

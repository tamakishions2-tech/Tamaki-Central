<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estúdio · Tamaki Central</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECE9E1;--panel:#FAF8F3;--panel2:#DEDACE;--line:#CBC5B6;--ink:#1B1912;--mute:#6B6556;
  --gold:#D9A300;--gold-ink:#1A1400;--cl:#C8643B;--cl-ink:#fff;--ok:#2E8C83;--danger:#C2412D;--shade:rgba(0,0,0,.55);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121110;--panel:#1C1B18;--panel2:#2A2823;--line:#38352E;--ink:#F3EFE3;--mute:#9C9686;
    --gold:#F2B705;--gold-ink:#1A1400;--cl:#E8875F;--cl-ink:#1A0E08;--ok:#3FB3A8;--danger:#E5533D;--shade:rgba(0,0,0,.72);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121110;--panel:#1C1B18;--panel2:#2A2823;--line:#38352E;--ink:#F3EFE3;--mute:#9C9686;
  --gold:#F2B705;--gold-ink:#1A1400;--cl:#E8875F;--cl-ink:#1A0E08;--ok:#3FB3A8;--danger:#E5533D;--shade:rgba(0,0,0,.72);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Chakra Petch',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
.tabs{flex:none;display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:none;border-radius:10px;padding:7px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab.cl{border-color:var(--cl);color:var(--cl)}
.tab.cl.on{background:var(--cl);color:var(--cl-ink)}
.tab b{font-size:11px;min-width:18px;padding:1px 5px;border-radius:9px;background:var(--danger);color:#fff;text-align:center}
.tab .sep{width:1px;align-self:stretch;background:var(--line)}
.stage{flex:1;position:relative;min-height:0}
.pane{position:absolute;inset:0;display:none}
.pane.on{display:block}
.pane iframe{width:100%;height:100%;border:0;background:var(--bg);display:block}
.scroll{height:100%;overflow:auto;padding:14px 14px 40px}
.wrap{max-width:760px;margin:0 auto}
.carregando{display:grid;place-items:center;height:100%;color:var(--mute);font-size:14px;text-align:center;padding:20px}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600;margin:18px 0 8px}
p.mute,.mute{color:var(--mute);font-size:13px;line-height:1.45}
.seg{display:flex;gap:6px;margin:4px 0 14px}
.seg button{flex:1;border:1.5px solid var(--line);background:none;border-radius:8px;padding:9px;font-weight:600;font-size:14px}
.seg button.on{background:var(--cl);border-color:var(--cl);color:var(--cl-ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:0;border-radius:8px;padding:9px 13px;font-weight:600;font-size:14px;background:var(--panel2);display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--cl);color:var(--cl-ink)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:none;color:var(--danger);border:1.5px solid var(--danger)}
.btn:disabled{opacity:.45}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.vid{border:2px solid transparent;border-radius:10px;background:var(--panel);padding:0;overflow:hidden;text-align:left}
.vid.on{border-color:var(--cl)}
.vid i{display:block;aspect-ratio:16/10;background:#000 center/cover no-repeat}
.vid span{display:block;padding:6px 8px;font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vid small{display:block;color:var(--mute);font-size:11px}
.lst{max-height:36vh;overflow:auto;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--panel)}
.lst label{display:flex;gap:10px;align-items:center;padding:7px 6px;border-radius:6px;font-size:14px}
.lst label small{margin-left:auto;color:var(--mute);font-size:11px;white-space:nowrap}
.lst input{width:18px;height:18px;accent-color:var(--cl);flex:none}
input[type=text],textarea{width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);font:inherit;font-size:15px}
textarea{resize:vertical;font-size:14px;line-height:1.4}
.bar{height:10px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--cl);transition:width .25s}
.prev{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.tela{flex:none;width:min(100%,270px);background:#000;border-radius:10px;overflow:hidden;position:relative}
.tela canvas{display:block;width:100%;height:auto}
.tela .fala{position:absolute;left:6px;right:6px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;font-size:13px;line-height:1.35;padding:6px 8px;border-radius:8px;text-align:center}
.tela .fala:empty{display:none}
.corte q{display:block;font-size:13px;line-height:1.35;margin-top:2px}
.tela .tempo{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:2px 7px;border-radius:6px;font-variant-numeric:tabular-nums}
.cortes{flex:1;min-width:240px;display:flex;flex-direction:column;gap:4px;max-height:62vh;overflow:auto}
.corte{display:flex;gap:8px;align-items:flex-start;border:1.5px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--panel);font-size:13px;text-align:left}
.corte.at{border-color:var(--cl);box-shadow:0 0 0 1px var(--cl) inset}
.corte.off{opacity:.45}
.corte input{width:18px;height:18px;accent-color:var(--cl);flex:none;margin-top:1px}
.corte b{font-variant-numeric:tabular-nums}
.corte span{display:block;color:var(--mute);font-size:12px;line-height:1.35}
.corte .vel{margin-left:auto;font-size:11px;font-weight:700;color:var(--cl);white-space:nowrap}
.mots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mot{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px}
.mot video{width:100%;border-radius:6px;background:#00b140;display:block;margin-bottom:6px}
.mot small{display:block;color:var(--mute);font-size:11px;margin-top:2px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--cl);color:var(--cl-ink);vertical-align:middle}
.aviso{border-left:3px solid var(--cl);padding:8px 10px;background:var(--panel);border-radius:0 8px 8px 0;font-size:13px;line-height:1.45;margin:10px 0}
.erro{border:1px solid var(--line);border-left:3px solid var(--danger);border-radius:8px;padding:8px 10px;background:var(--panel);margin-bottom:6px;font-size:13px}
.erro small{color:var(--mute);font-size:11px;display:block}
.erro pre{white-space:pre-wrap;word-break:break-word;font-size:11px;color:var(--mute);margin-top:4px;max-height:120px;overflow:auto}
#motionBox{margin-top:10px}
#motionBox iframe{width:100%;height:170px;border:0;border-radius:8px;background:#111;display:block}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:88vw;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<nav class="tabs" id="tabs" aria-label="Abas do Estúdio"></nav>
<main class="stage" id="stage"></main>
<input type="file" id="fDlc" accept=".json,.txt,application/json,text/plain" hidden>
<input type="file" id="fResp" accept=".json,.txt,.zip,application/json,text/plain,application/zip" hidden>
<div id="toast" role="status"></div>
<script>
'use strict';
/* =====================================================================
   Estúdio · Tamaki Central
   Uma página só com: Biblioteca, Editor, Efeitos, Voz, Motion (as abas do site),
   ✦ Claude (pedir edição + prévia dos cortes) e ⚠ Erros.
   Funciona colada como aba de código na Central ou como arquivo no site.
   As abas do site abrem pelo endereço completo, então não depende de onde está.
   ===================================================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SITE=(()=>{const p=location.protocol;
  if(p==='blob:')return location.origin+'/Tamaki-Central/';
  if(p==='http:'||p==='https:')return new URL('.',location.href).href;
  return 'https://tamakishions2-tech.github.io/Tamaki-Central/';})();
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3000);}
const fmtT=t=>{t=Math.max(0,t||0);const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0');};
const fmtTd=t=>{t=Math.max(0,t||0);const m=Math.floor(t/60),s=(t%60).toFixed(1);return m+':'+(s<10?'0':'')+s;};
const fmtSize=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const lerJ=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d;}catch(_){return d;}};
const gravaJ=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(_){return false;}};
const espera=ms=>new Promise(r=>setTimeout(r,ms));

/* ================= ⚠ erros: guarda tudo o que quebrar, aqui e dentro das abas ================= */
let ERROS=lerJ('tamaki-estudio-erros',[]);
function logErro(aba,msg,det){
  msg=String(msg||'erro sem mensagem').slice(0,500);
  const ult=ERROS[0];if(ult&&ult.msg===msg&&ult.aba===aba&&Date.now()-ult.t<3000)return;
  ERROS.unshift({t:Date.now(),aba,msg,det:String(det||'').slice(0,1500)});ERROS=ERROS.slice(0,120);gravaJ('tamaki-estudio-erros',ERROS);
  desenharAbas();if(atual==='erros')desenharErros();
}
addEventListener('error',e=>logErro('Estúdio',e.message,(e.filename||'')+':'+(e.lineno||'')+(e.error&&e.error.stack?'\n'+e.error.stack:'')));
addEventListener('unhandledrejection',e=>{const r=e.reason;logErro('Estúdio',r&&r.message||r,r&&r.stack);});
function vigiar(nome,f){ // escuta os erros de dentro de uma aba (mesmo site)
  try{const w=f.contentWindow;if(!w||w.__vigiado)return;w.__vigiado=1;
    w.addEventListener('error',e=>logErro(nome,e.message,(e.filename||'').split('/').pop()+':'+(e.lineno||'')+(e.error&&e.error.stack?'\n'+e.error.stack:'')));
    w.addEventListener('unhandledrejection',e=>{const r=e.reason;logErro(nome,r&&r.message||r,r&&r.stack);});
    const ce=w.console.error.bind(w.console);w.console.error=(...a)=>{logErro(nome,a.map(x=>x&&x.message||String(x)).join(' '),a.map(x=>x&&x.stack||'').join('\n'));ce(...a);};
  }catch(_){logErro(nome,'Não consigo olhar dentro desta aba (endereço diferente). Abra o Estúdio pela Central.');}
}

/* ================= abas ================= */
const ABAS=[
  {k:'bib',n:'📚 Biblioteca',url:'biblioteca.html'},
  {k:'editor',n:'🎬 Editor',url:'editor.html'},
  {k:'efeitos',n:'🎧 Efeitos',url:'efeitos.html'},
  {k:'voz',n:'🎙️ Voz',url:'estudio-voz.html'},
  {k:'motion',n:'✨ Motion',url:'motion.html'},
  {k:'claude',n:'✦ Claude',cl:1},
  {k:'erros',n:'⚠ Erros'},
];
const frames={},prontos={};let atual=lerJ('tamaki-estudio-aba','claude');
if(!ABAS.some(a=>a.k===atual))atual='claude';
function desenharAbas(){
  $('#tabs').innerHTML=ABAS.map(a=>`${a.k==='claude'?'<span class="sep"></span>':''}<button class="tab${a.cl?' cl':''}${atual===a.k?' on':''}" data-k="${a.k}">${a.n}${a.k==='erros'&&ERROS.length?`<b>${ERROS.length}</b>`:''}</button>`).join('');
}
$('#tabs').onclick=e=>{const b=e.target.closest('[data-k]');if(b)abrir(b.dataset.k);};
function pane(k){let p=document.getElementById('p-'+k);if(!p){p=document.createElement('section');p.className='pane';p.id='p-'+k;$('#stage').appendChild(p);}return p;}
function abrir(k){
  atual=k;gravaJ('tamaki-estudio-aba',k);desenharAbas();
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+k));
  const a=ABAS.find(x=>x.k===k),p=pane(k);p.classList.add('on');
  if(a.url)frameDe(k);
  else if(k==='claude')desenharClaude();
  else if(k==='erros')desenharErros();
}
/* abre a aba do site uma vez e mantém viva (o Editor não perde o projeto ao trocar de aba) */
function frameDe(k){
  if(frames[k])return prontos[k];
  const a=ABAS.find(x=>x.k===k),p=pane(k);
  const f=document.createElement('iframe');f.title=a.n;f.allow='microphone; autoplay; clipboard-write; fullscreen';
  frames[k]=f;p.appendChild(f);
  prontos[k]=new Promise(ok=>{f.addEventListener('load',()=>{vigiar(a.n.replace(/^\S+\s/,''),f);ok(f);},{once:true});});
  f.src=SITE+a.url;
  return prontos[k];
}

/* ================= banco: Biblioteca e caixa de Recebidos (mesmos do site) ================= */
function abrirDb(nome,store){return new Promise((ok,no)=>{const r=indexedDB.open(nome,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(store))d.createObjectStore(store,{keyPath:'id'});};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});}
async function dbTx(nome,store,mode,fn){const d=await abrirDb(nome,store);try{return await new Promise((ok,no)=>{const t=d.transaction(store,mode),st=t.objectStore(store);let r;const q=fn(st);if(q)q.onsuccess=()=>{r=q.result;};t.oncomplete=()=>ok(r);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error);});}finally{d.close();}}
const bibTodos=()=>dbTx('tamaki-biblioteca','itens','readonly',s=>s.getAll());
const bibLer=id=>dbTx('tamaki-biblioteca','itens','readonly',s=>s.get(id));
const bibPor=it=>dbTx('tamaki-biblioteca','itens','readwrite',s=>s.put(it));
const caixaPor=it=>dbTx('tamaki-caixa','itens','readwrite',s=>s.put(it));
const avisaBib=id=>{try{const c=new BroadcastChannel('tamaki-biblioteca');c.postMessage({novo:id});c.close();}catch(_){}};
function notasEscrita(){const D=lerJ('kurogane:data',{})||{},L=[];
  const add=(arr,nomeP,tit,html)=>(D[arr]||[]).forEach(o=>L.push({id:o.id,pasta:nomeP(o),titulo:tit(o)||'Sem título',html:html(o)||''}));
  const bl=o=>(o.blocks||[]).filter(b=>b.type==='texto').map(b=>b.content||'').join('<p></p>'),pn=o=>((D.pastas||[]).find(p=>p.id===o.pasta)||{}).nome||(o.pasta==='roteiros'?'Roteiros da Tamaki':'Notas');
  add('chapters',()=>'Capítulos',o=>o.title,o=>o.content);add('personagens',()=>'Personagens',o=>o.nome,bl);add('cenarios',()=>'Cenários',o=>o.nome,bl);add('mundo',()=>'Mundo',o=>o.titulo,o=>o.content);add('notas',pn,o=>o.titulo,o=>o.html);
  return L;}
const htmlTxt=h=>{const d=document.createElement('div');d.innerHTML=String(h||'').replace(/<(br|\/p|\/div|\/li|\/h\d)>/gi,'\n$&');return d.textContent.replace(/\n{3,}/g,'\n\n').trim();};
function waitEv(el,ev,ms=8000){return new Promise((ok,no)=>{const t=setTimeout(()=>no(new Error('tempo')),ms);el.addEventListener(ev,()=>{clearTimeout(t);ok();},{once:true});el.addEventListener('error',()=>{clearTimeout(t);no(new Error('erro'));},{once:true});});}
async function realDur(el){if(isFinite(el.duration)&&el.duration>0)return el.duration;el.currentTime=1e9;try{await waitEv(el,'timeupdate',4000);}catch(_){}const d=el.duration;el.currentTime=0;try{await waitEv(el,'seeked',2000);}catch(_){}return isFinite(d)?d:0;}
function baixarBlob(b,nome){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);}

/* ================= ✦ Claude ================= */
let sub=lerJ('tamaki-estudio-sub','respostas');
const RESP_KEY='tamaki-claude-respostas';
let RESP=lerJ(RESP_KEY,[]);const salvaResp=()=>gravaJ(RESP_KEY,RESP);
let aberta=null; // resposta aberta na prévia
function desenharClaude(){
  const p=pane('claude');
  p.innerHTML=`<div class="scroll"><div class="wrap">
    <div class="seg"><button data-s="pedir" class="${sub==='pedir'?'on':''}">1 · Pedir edição</button><button data-s="respostas" class="${sub==='respostas'?'on':''}">2 · Respostas e prévia</button><button data-s="esteticas" class="${sub==='esteticas'?'on':''}">🎨 Estéticas</button></div>
    <div id="clCorpo"></div></div></div>`;
  p.querySelector('.seg').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;sub=b.dataset.s;gravaJ('tamaki-estudio-sub',sub);aberta=null;pararPrevia();desenharClaude();};
  if(sub==='pedir')desenharPedir();else if(sub==='esteticas')desenharEsteticas();else if(aberta)desenharPrevia(aberta);else desenharRespostas();
}

/* ---------- 1 · pedir edição ---------- */
const PED={video:null,notas:null,extra:''};
async function desenharPedir(){
  const c=$('#clCorpo');c.innerHTML='<p class="mute">Lendo a Biblioteca…</p>';
  let L=[];try{L=(await bibTodos()).filter(x=>x.tipo==='video').sort((a,b)=>b.criado-a.criado);}catch(e){logErro('Claude','Não abri a Biblioteca',e.message);}
  const notas=notasEscrita(),peso=n=>n.pasta==='Roteiros da Tamaki'?0:n.pasta==='Capítulos'?2:['Personagens','Cenários','Mundo'].includes(n.pasta)?3:1;
  notas.sort((a,b)=>peso(a)-peso(b));
  if(PED.notas===null)PED.notas=new Set();
  c.innerHTML=`<h2>Pedir edição pro Claude</h2><p class="mute">Escolha a gameplay, marque o roteiro da aba Escrita e gere o pacote. O som do vídeo fica de fora.</p>
    <h3>Gameplay</h3>${L.length?`<div class="vids" id="pVids">${L.slice(0,40).map(v=>`<button class="vid${PED.video===v.id?' on':''}" data-id="${esc(v.id)}"><i style="${v.thumb?`background-image:url('${v.thumb}')`:''}"></i><span>${esc(v.nome||'Vídeo')}<small>${fmtT(v.dur)} · ${new Date(v.criado).toLocaleDateString('pt-BR')}</small></span></button>`).join('')}</div>`:'<p class="aviso">Nenhum vídeo na Biblioteca ainda. Adicione a gameplay na aba 📚 Biblioteca.</p>'}
    <h3>Roteiro da aba Escrita</h3>${notas.length?`<div class="lst" id="pNotas">${notas.map(n=>`<label><input type="checkbox" value="${esc(n.id)}" ${PED.notas.has(n.id)?'checked':''}>${esc(n.titulo)}<small>${esc(n.pasta)}</small></label>`).join('')}</div>`:'<p class="mute">Nenhum texto na aba Escrita.</p>'}
    <h3>Nome do projeto e pedido extra</h3><input type="text" id="pNome" maxlength="80" placeholder="Nome do projeto">
    <textarea id="pExtra" rows="3" style="margin-top:8px" placeholder="Ex.: para Shorts, ritmo rápido, corta as partes paradas…">${esc(PED.extra)}</textarea>
    <div class="btns"><button class="btn pri" id="pGerar">✦ Gerar pacote</button></div><div id="pProg"></div>`;
  const nomeIn=$('#pNome'),vSel=()=>L.find(x=>x.id===PED.video);
  nomeIn.value=PED.nome||(vSel()?vSel().nome:'');
  const vids=$('#pVids');if(vids)vids.onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;PED.video=b.dataset.id;vids.querySelectorAll('.vid').forEach(x=>x.classList.toggle('on',x===b));if(!nomeIn.value.trim())nomeIn.value=vSel().nome||'';};
  const ln=$('#pNotas');if(ln)ln.onchange=e=>{const i=e.target;i.checked?PED.notas.add(i.value):PED.notas.delete(i.value);};
  nomeIn.oninput=()=>PED.nome=nomeIn.value;$('#pExtra').oninput=e=>PED.extra=e.target.value;

async function extrairQuadros(it,prog){

    while(Math.ceil(n/porFolha)>15){passo++;n=Math.floor(dur/passo)+1;}

      v.currentTime=t;try{await waitEv(v,'seeked',8000);}catch(_){}
      const i=k%porFolha,x=(i%cols)*cw,y=Math.floor(i/cols)*ch;try{g.drawImage(v,x,y,cw,ch);}catch(_){}
      const lab=fmtT(marca);g.font='bold 22px system-ui,sans-serif';g.textBaseline='top';const tw=g.measureText(lab).width;
      g.fillStyle='rgba(0,0,0,.78)';g.fillRect(x,y,tw+14,30);g.fillStyle='#FFD34D';g.fillText(lab,x+7,y+4);g.strokeStyle='#000';g.lineWidth=3;g.strokeRect(x+1.5,y+1.5,cw-3,ch-3);
      lista[lista.length-1].ate=marca;prog&&prog((k+1)/n);

    if(cv)lista[lista.length-1].cv=cv;
    for(let i=0;i<lista.length;i++){const f=lista[i];f.nome=`quadros-${String(i+1).padStart(2,'0')}.jpg`;f.blob=await new Promise(ok=>f.cv.toBlob(ok,'image/jpeg',.74));delete f.cv;}
    return{dur,w,h,passo,lista};
  }finally{v.removeAttribute('src');v.load();URL.revokeObjectURL(url);}
}
function paginasTexto(linhasIn){
  const W=1240,H=1754,M=90,lh=44,pags=[];let cv,g,y;
  const nova=()=>{cv=document.createElement('canvas');cv.width=W;cv.height=H;g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);g.textBaseline='top';y=M;pags.push(cv);};nova();
  for(const [txt,est] of linhasIn){
    const tam=est==='h1'?46:est==='h2'?34:30,fonte=(est==='h1'||est==='h2'?'bold ':'')+tam+'px system-ui,sans-serif';g.font=fonte;
    const pal=String(txt).split(/(\s+)/);let lin='';const out=[];
    for(const p of pal){const t=lin+p;if(g.measureText(t).width>W-M*2&&lin.trim()){out.push(lin.trimEnd());lin=p.trimStart();}else lin=t;}out.push(lin.trimEnd());

}
async function montarPdf(pedido,folhas){
  const v=pedido.video,L=[['Pedido pro Claude · Tamaki Central','h1'],['Projeto: '+pedido.projeto,'h2'],[`Vídeo: ${v.nome||'(sem nome)'} · ${fmtT(v.dur)} · ${v.w}×${v.h}`,''],['id na Biblioteca: '+v.id,'mute'],

async function gravarMotion(m,prog){

    const fim=()=>{clearInterval(iv);clearTimeout(t);removeEventListener('message',h);};
    const t=setTimeout(()=>{fim();no(new Error('demorou demais'));},(dur+30)*1000);
    const h=e=>{const d=e.data||{};if(e.source!==f.contentWindow||d.id!==id)return;if(d.tipo==='motion-feito'){fim();ok({blob:d.blob,dur});}else if(d.tipo==='motion-erro'){fim();no(new Error(d.msg||'erro'));}};

/* ================= 🎨 Estéticas (DLC) =================
   Uma estética é um arquivo .json que se instala e desinstala quando quiser.
   Ela traz (1) o código dos motions dela e (2) as "receitas": como cada papel
   (título, impacto, personagem, transição…) vira motion naquela estética.
   O Claude escreve os motions por papel; aqui você escolhe a estética na hora de gerar. */
const DLC_KEY='tamaki-dlc';
let DLCS=lerJ(DLC_KEY,[]);const salvaDlc=()=>gravaJ(DLC_KEY,DLCS);
const PAPEIS={titulo:'Título de abertura',impacto:'Palavra de impacto',personagem:'Apresentação de personagem',nome:'Nome / legenda',aviso:'Aviso / alerta',
  transicao:'Transição',batalha:'Começo de batalha',vida:'Barra de vida',captura:'Capturado / conquista',fala:'Caixa de fala',final:'Encerramento'};
/* estética padrão: só usa os motions que já vêm na aba Motion */
const PADRAO={id:'padrao',nome:'Padrão',icone:'⚪',desc:'Os motions que já vêm na aba Motion',receitas:{
  titulo:[{tipo:'intro',texto:'{texto}',sub:'{sub}',tam:10,y:17,anim:'pop'}],

  personagem:[{tipo:'faixa',texto:'{texto}',sub:'{sub}',tam:6,x:6,y:74,cor:'#151515',cor2:'#d6a400'}],
  nome:[{tipo:'faixa',texto:'{texto}',sub:'{sub}',tam:6,x:6,y:74,cor:'#151515',cor2:'#d6a400'}],
  aviso:[{tipo:'texto',texto:'{texto}',fonte:'bebas',tam:11,y:17,anim:'pop',cor:'#ffffff',cor2:'#c2412d'}],
  batalha:[{tipo:'texto',texto:'{texto|BATALHA!}',fonte:'bebas',tam:14,y:17,anim:'pop',cor:'#ffffff',cor2:'#c2412d'}],
  vida:[{tipo:'texto',texto:'{texto}',fonte:'bebas',tam:10,y:17,anim:'pop',cor:'#ffffff',cor2:'#151515'}],
  captura:[{tipo:'texto',texto:'{texto|Conseguiu!}',fonte:'bebas',tam:12,y:17,anim:'pop',cor:'#ffffff',cor2:'#2e8c83'}],
  fala:[{tipo:'faixa',texto:'{texto}',sub:'{sub}',tam:5,x:6,y:78,cor:'#151515',cor2:'#ffffff'}],
  final:[{tipo:'intro',texto:'{texto}',sub:'{sub}',tam:9,y:17,anim:'pop'},{tipo:'inscreva',tam:7,x:50,y:84,ini:.5}]}};
const ativas=()=>DLCS.filter(d=>d.ativo);
const estetica=id=>id==='padrao'||!id?PADRAO:(DLCS.find(d=>d.id===id&&d.ativo)||PADRAO);
/* troca {texto}, {sub}, {texto|padrão} pelos valores do motion */
function preencher(v,m){
  if(typeof v!=='string')return v;
  const so=v.match(/^\{(\w+)(?:\|([^}]*))?\}$/);
  if(so){const x=m[so[1]];return x===undefined||x===''?(so[2]!==undefined?so[2]:''):x;}
  return v.replace(/\{(\w+)(?:\|([^}]*))?\}/g,(_,k,d)=>{const x=m[k];return x===undefined||x===''?(d||''):String(x);});
}
/* motion do Claude → itens da aba Motion, na estética escolhida */
function resolverMotion(m,est){
  if(Array.isArray(m.itens)&&m.itens.length&&!m.papel)return {itens:m.itens,de:'fixo'};
  const papel=m.papel||'impacto',rec=(est.receitas||{})[papel]||PADRAO.receitas[papel]||PADRAO.receitas.impacto,de=(est.receitas||{})[papel]?est.nome:'Padrão';
  const dur=+m.dur||3;
  const itens=rec.map(t=>{const it={};for(const [k,v] of Object.entries(t))it[k]=preencher(v,m);
    if(it.ini==null)it.ini=0;if(it.dur==null)it.dur=Math.max(.3,dur-(+it.ini||0));
    for(const k of ['x','y','tam','cor','cor2','img','lado'])if(m[k]!==undefined&&t[k]===undefined)it[k]=m[k];
    return it;});
  return {itens,de};
}
async function instalarDlc(f){
  let D;try{D=JSON.parse((await f.text()).replace(/^﻿/,''));}catch(_){return toast('Esse arquivo não é uma estética');}
  if(!D||D.tamaki!=='dlc-estetica'||!D.id||!D.receitas)return toast('Esse arquivo não é uma estética');
  if(D.codigo){try{new Function('Motion',D.codigo);}catch(e){logErro('Estéticas',`O código de “${D.nome}” tem erro: ${e.message}`);return toast('O código dessa estética tem erro (veja ⚠ Erros)');}}
  const ant=DLCS.find(x=>x.id===D.id);D.ativo=ant?ant.ativo:true;D.instalada=Date.now();
  DLCS=DLCS.filter(x=>x.id!==D.id);DLCS.push(D);salvaDlc();sincMotion();
  toast(`${D.icone||'🎨'} ${D.nome} ${ant?'atualizada':'instalada'}!`);
}
/* deixa os motions das estéticas ligadas também na aba ✨ Motion (para editar à mão) */
function sincMotion(){
  try{let P=lerJ('motion-plugins',[]);P=P.filter(p=>!p.dlc);
    for(const d of ativas())if(d.codigo)P.push({nome:`${d.icone||'🎨'} DLC: ${d.nome}`,codigo:d.codigo,dlc:d.id});
    gravaJ('motion-plugins',P);
    if(frames.motion)try{frames.motion.contentWindow.location.reload();}catch(_){}
  }catch(e){logErro('Estéticas',e.message,e.stack);}
}

    ${DLCS.map((d,i)=>`<div class="card" style="border-left:4px solid ${esc(d.cor||'var(--cl)')}"><b>${esc(d.icone||'🎨')} ${esc(d.nome)}</b> ${d.ativo?'<span class="tag">ligada</span>':'<span class="tag" style="background:var(--panel2);color:var(--mute)">desligada</span>'}
      <p class="mute" style="margin-top:4px">${esc(d.desc||'')}<br>Papéis: ${Object.keys(d.receitas).map(k=>esc(PAPEIS[k]||k)).join(', ')}</p>
      <div class="btns"><button class="btn ${d.ativo?'':'ok'}" data-i="${i}" data-a="liga">${d.ativo?'Desligar':'Ligar'}</button><button class="btn danger" data-i="${i}" data-a="tira">Remover</button></div></div>`).join('')}
    ${DLCS.length?'':'<p class="aviso">Nenhuma estética instalada. Toque em Instalar e escolha um arquivo dlc-….json.</p>'}`;
  $('#dlcIn').onclick=()=>$('#fDlc').click();
  c.onclick=e=>{const b=e.target.closest('[data-a]');if(!b||b.dataset.i==null)return;const d=DLCS[+b.dataset.i];if(!d)return;
    if(b.dataset.a==='liga'){d.ativo=!d.ativo;salvaDlc();sincMotion();toast(`${d.nome} ${d.ativo?'ligada':'desligada'}`);desenharEsteticas();}
    else if(b.dataset.a==='tira'){if(!confirm(`Remover a estética “${d.nome}”? Os motions já gerados continuam na Biblioteca.`))return;DLCS=DLCS.filter(x=>x!==d);salvaDlc();sincMotion();desenharEsteticas();}};
}

/* ================= ⚠ Erros ================= */
function textoErros(){return `Erros do Estúdio · Tamaki Central\nGerado em ${new Date().toLocaleString('pt-BR')}\nEndereço: ${location.protocol} · site ${SITE}\nNavegador: ${navigator.userAgent}\n\n`+
  ERROS.map(e=>`[${new Date(e.t).toLocaleString('pt-BR')}] ${e.aba}: ${e.msg}${e.det?'\n  '+e.det.replace(/\n/g,'\n  '):''}`).join('\n\n');}
function desenharErros(){
  const p=pane('erros');
  p.innerHTML=`<div class="scroll"><div class="wrap"><h2>Erros</h2><p class="mute">Tudo o que quebrar no Estúdio e nas abas aparece aqui. Baixe o relatório e mande no chat do Claude.</p>
    <div class="btns" style="margin-bottom:12px"><button class="btn pri" data-a="down" ${ERROS.length?'':'disabled'}>⬇ Baixar relatório</button><button class="btn" data-a="copy" ${ERROS.length?'':'disabled'}>Copiar</button><button class="btn danger" data-a="limpar" ${ERROS.length?'':'disabled'}>Limpar</button></div>
    ${ERROS.length?ERROS.map(e=>`<div class="erro"><small>${new Date(e.t).toLocaleString('pt-BR')} · ${esc(e.aba)}</small>${esc(e.msg)}${e.det?`<pre>${esc(e.det)}</pre>`:''}</div>`).join(''):'<p class="aviso">Nenhum erro até agora. 🎉</p>'}</div></div>`;
  p.querySelector('.btns').onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;
    if(b.dataset.a==='down')baixarBlob(new Blob([textoErros()],{type:'text/plain'}),'erros-estudio.txt');
    else if(b.dataset.a==='copy'){try{await navigator.clipboard.writeText(textoErros());toast('Copiado! Cole no chat do Claude.');}catch(_){toast('Não deu para copiar. Use Baixar.');}}
    else if(b.dataset.a==='limpar'){ERROS=[];gravaJ('tamaki-estudio-erros',ERROS);desenharAbas();desenharErros();}};
}

/* ================= início ================= */
if(location.protocol==='file:'||location.protocol==='content:')logErro('Estúdio','Este arquivo foi aberto direto do tablet. Assim ele não enxerga a sua Biblioteca: cole o código como aba na Central.');
desenharAbas();abrir(atual);
</script>
